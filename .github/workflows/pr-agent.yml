name: PR Agent

on:
  workflow_call:
    inputs:
      mode:
        description: '"full" (opened/reopened) or "update" (synchronize)'
        type: string
        required: true
    secrets:
      LLM_API_KEY:
        required: true
      LLM_API_BASE:
        required: true
      LLM_MODEL:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-agent:
    name: PR Agent (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v5
        with:
          # Shallow clone depth optimized for accurate diff computation without full history
          fetch-depth: 20

      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          # ALIAS for PR Agent's internal check — same value as OPENAI__KEY
          OPENAI_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI__KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.LLM_API_BASE }}

          CONFIG__MODEL: ${{ secrets.LLM_MODEL }}
          CONFIG__FALLBACK_MODELS: ${{ secrets.LLM_MODEL }}

          # Keep output minimal and structured
          CONFIG__VERBOSITY_LEVEL: "0"
          CONFIG__PUBLISH_OUTPUT_PROGRESS: "false"

          # Deterministic outputs for consistent reviews
          CONFIG__TEMPERATURE: "0"

          # Balanced token limit for PRs between 200–1000 lines
          CONFIG__MAX_MODEL_TOKENS: "64000"

          # Prevent long-running LLM calls from blocking CI
          CONFIG__AI_TIMEOUT: "60"

          # Custom model — not in PR Agent's built-in token map
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32000"
          CONFIG__MODEL_TOKEN_COUNT_ESTIMATE_FACTOR: "0.5"

          # -----------------------------
          # Review configuration
          # -----------------------------

          # Disable all review dimensions except security (for full mode)
          PR_REVIEWER__REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: "false"
          PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"
          PR_REVIEWER__REQUIRE_CAN_BE_SPLIT_REVIEW: "false"
          PR_REVIEWER__REQUIRE_ESTIMATE_CONTRIBUTION_TIME_COST: "false"
          PR_REVIEWER__REQUIRE_TODO_SCAN: "false"
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: "false"

          # Run security review only on full mode (opened/reopened)
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: ${{ inputs.mode == 'full' && 'true' || 'false' }}

          # Focus on the most impactful findings
          PR_REVIEWER__NUM_MAX_FINDINGS: "6"

          # Post findings inline on the changed lines for immediate context
          PR_REVIEWER__INLINE_KEY_ISSUES: "true"

          # Add a security label to the PR when security issues are found
          PR_REVIEWER__ENABLE_REVIEW_LABELS_SECURITY: "true"

          # Keep comments lean: no coverage footer
          PR_REVIEWER__ENABLE_REVIEW_COVERAGE_FOOTER: "false"

          # Stay silent when the PR is clean (no "no major issues" noise)
          PR_REVIEWER__PUBLISH_OUTPUT_NO_SUGGESTIONS: "false"

          # Guide the model toward concise, high-signal senior review
          PR_REVIEWER__EXTRA_INSTRUCTIONS: "Report only security vulnerabilities and correctness or logic bugs that are likely to cause real failures. Ignore style, formatting, naming, duplication, or lint-level issues — the team's linter and the dev's own AI already handle those. For each finding, state the concrete problem in one clear sentence, then give a minimal, focused fix as a short code snippet (a few lines) that solves the exact issue. Do not rewrite whole functions or add commentary. Be direct and precise."

          # Disable verbose UI elements in comments
          PR_REVIEWER__ENABLE_INTRO_TEXT: "false"
          PR_REVIEWER__ENABLE_HELP_TEXT: "false"
          PR_REVIEWER__FINAL_UPDATE_MESSAGE: "false"

          # Use a single persistent comment updated over time
          PR_REVIEWER__PERSISTENT_COMMENT: "true"

          # -----------------------------
          # GitHub integration
          # -----------------------------

          GITHUB_TOKEN: ${{ github.token }}

          # Run auto-review only. The /improve tool is intentionally off so the
          # output stays a single high-signal review (no duplicate code-suggestion
          # comments). Proposed fixes are embedded in each finding via
          # PR_REVIEWER__EXTRA_INSTRUCTIONS instead.
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"

          github_action_config.auto_describe: "false"