name: PR Agent

on:
  workflow_call:
    inputs:
      mode:
        description: '"full" (opened/reopened) or "update" (synchronize)'
        type: string
        required: true
    outputs:
      posted_comments:
        description: '"true" if the PR Agent published a review comment (found issues); "false" if it stayed silent'
        value: ${{ jobs.pr-agent.outputs.posted_comments }}
    secrets:
      LLM_API_KEY:
        required: true
      LLM_API_BASE:
        required: true
      LLM_MODEL:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-agent:
    name: PR Agent (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      posted_comments: ${{ steps.detect.outputs.posted_comments }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Shallow clone depth optimized for accurate diff computation without full history
          fetch-depth: 20

      # Snapshot PR comment/review count before the agent runs. The agent is
      # configured to stay silent when the PR is clean, so a comment-count
      # increase below means it found issues (behaves like "changes requested").
      - name: Capture comment baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          NUM="${{ github.event.pull_request.number }}"
          REVIEWS=$(gh api "repos/$REPO/pulls/$NUM/reviews" --paginate 2>/dev/null | jq 'length' || echo 0)
          COMMENTS=$(gh api "repos/$REPO/pulls/$NUM/comments" --paginate 2>/dev/null | jq 'length' || echo 0)
          ISSUE_COMMENTS=$(gh api "repos/$REPO/issues/$NUM/comments" --paginate 2>/dev/null | jq 'length' || echo 0)
          echo "$((REVIEWS + COMMENTS + ISSUE_COMMENTS))" > comment_baseline.txt

      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          # ALIAS for PR Agent's internal check — same value as OPENAI__KEY
          OPENAI_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI__KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.LLM_API_BASE }}

          CONFIG__MODEL: ${{ secrets.LLM_MODEL }}
          CONFIG__FALLBACK_MODELS: ${{ secrets.LLM_MODEL }}

          # Keep output minimal and structured
          CONFIG__VERBOSITY_LEVEL: "0"
          CONFIG__PUBLISH_OUTPUT_PROGRESS: "false"

          # Deterministic outputs for consistent reviews
          CONFIG__TEMPERATURE: "0"

          # Balanced token limit for PRs between 200–1000 lines
          CONFIG__MAX_MODEL_TOKENS: "64000"

          # Prevent long-running LLM calls from blocking CI
          CONFIG__AI_TIMEOUT: "60"

          # Custom model — not in PR Agent's built-in token map
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32000"
          CONFIG__MODEL_TOKEN_COUNT_ESTIMATE_FACTOR: "0.5"

          # -----------------------------
          # Review configuration
          # -----------------------------

          # Disable all review dimensions except security (for full mode)
          PR_REVIEWER__REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: "false"
          PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"
          PR_REVIEWER__REQUIRE_CAN_BE_SPLIT_REVIEW: "false"
          PR_REVIEWER__REQUIRE_ESTIMATE_CONTRIBUTION_TIME_COST: "false"
          PR_REVIEWER__REQUIRE_TODO_SCAN: "false"
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: "false"

          # Run security review only on full mode (opened/reopened)
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: ${{ inputs.mode == 'full' && 'true' || 'false' }}

          # Focus on the most impactful findings
          PR_REVIEWER__NUM_MAX_FINDINGS: "6"

          # Post findings inline on the changed lines for immediate context
          PR_REVIEWER__INLINE_KEY_ISSUES: "true"

          # Add a security label to the PR when security issues are found
          PR_REVIEWER__ENABLE_REVIEW_LABELS_SECURITY: "true"

          # Keep comments lean: no coverage footer
          PR_REVIEWER__ENABLE_REVIEW_COVERAGE_FOOTER: "false"

          # Stay silent when the PR is clean (no "no major issues" noise)
          PR_REVIEWER__PUBLISH_OUTPUT_NO_SUGGESTIONS: "false"

          # Guide the model toward concise, high-signal senior review
          # Guía al modelo para actuar como Arquitecto Principal (en una sola línea válida para YAML)
          PR_REVIEWER__EXTRA_INSTRUCTIONS: "You are a Principal Software Architect and Security Lead. Focus exclusively on high-level architecture, design patterns, scalability, maintainability, severe security flaws, and architectural anti-patterns (e.g., tight coupling, circular dependencies, breaking data flows, bad abstraction layers). STRICT RULES: 1. IGNORE all syntax, formatting, naming, and lint issues. 2. For every finding, provide: - **Impact:** One clear sentence explaining why this design choice harms the system. - **Solution:** A concise architectural direction or minimal structural code block."
          
          # Disable verbose UI elements in comments
          PR_REVIEWER__ENABLE_INTRO_TEXT: "false"
          PR_REVIEWER__ENABLE_HELP_TEXT: "false"
          PR_REVIEWER__FINAL_UPDATE_MESSAGE: "false"

          # Use a single persistent comment updated over time
          PR_REVIEWER__PERSISTENT_COMMENT: "true"

          # -----------------------------
          # GitHub integration
          # -----------------------------

          GITHUB_TOKEN: ${{ github.token }}

          # Run auto-review only. The /improve tool is intentionally off so the
          # output stays a single high-signal review (no duplicate code-suggestion
          # comments). Proposed fixes are embedded in each finding via
          # PR_REVIEWER__EXTRA_INSTRUCTIONS instead.
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"

          github_action_config.auto_describe: "false"

      # Compare the comment/review count after the agent ran against the
      # baseline. If it grew, the agent published a review (found issues).
      - name: Detect agent comments
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          NUM="${{ github.event.pull_request.number }}"
          BASELINE=$(cat comment_baseline.txt 2>/dev/null || echo 0)
          REVIEWS=$(gh api "repos/$REPO/pulls/$NUM/reviews" --paginate 2>/dev/null | jq 'length' || echo 0)
          COMMENTS=$(gh api "repos/$REPO/pulls/$NUM/comments" --paginate 2>/dev/null | jq 'length' || echo 0)
          ISSUE_COMMENTS=$(gh api "repos/$REPO/issues/$NUM/comments" --paginate 2>/dev/null | jq 'length' || echo 0)
          AFTER=$((REVIEWS + COMMENTS + ISSUE_COMMENTS))
          if [ "$AFTER" -gt "$BASELINE" ]; then
            echo "posted_comments=true" >> "$GITHUB_OUTPUT"
            echo "PR Agent published findings on PR #$NUM (comments: $BASELINE → $AFTER)."
          else
            echo "posted_comments=false" >> "$GITHUB_OUTPUT"
            echo "PR Agent found no issues on PR #$NUM."
          fi