# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Jira Guard — reusable PR quality gate + conflict scanner
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Call from any repo:
#    uses: byteit-ai/.github/.github/workflows/jira-guard.yml@main
#
#  Caller triggers:
#    ci.yml         — pull_request: [opened, synchronize, reopened]
#    cd.yml         — push: [main]
#    review-guard.yml — pull_request_review: [submitted] (2c In Progress / 2d Ready To Deploy)
#  All transitions use .to.name (never hardcoded transition names).
#  Debug: set repo secret ACTIONS_STEP_DEBUG=true for verbose runner logs.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
name: Jira Guard

on:
  workflow_call:
    inputs:
      jira_domain:
        description: "Jira cloud domain (e.g. mycompany.atlassian.net)"
        type: string
        default: "byteit-ai.atlassian.net"
      min_description_length:
        description: "Minimum PR body length (chars)"
        type: number
        default: 20
      pr_agent_enabled:
        description: "Enable PR Agent review"
        type: boolean
        default: true
    secrets:
      JIRA_EMAIL:
        required: true
      JIRA_API_TOKEN:
        required: true
      LLM_API_KEY:
        required: false
      LLM_API_BASE:
        required: false
      LLM_MODEL:
        required: false

jobs:
  jira-guard:
    name: Jira Guard
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jira_key: ${{ steps.jira_key.outputs.key }}
      moved_to_review: ${{ steps.review_transition.outputs.transitioned }}

    steps:
      # ── 0 · Setup ─────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Init log files
        run: touch errors.log warnings.log

      - name: "1 · Extract Jira key"
        id: jira_key
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GIT_EVENT: ${{ github.event_name }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          [[ "${RUNNER_DEBUG:-0}" == "1" ]] && set -x

          if [ "$GIT_EVENT" = "pull_request" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "key=" >> "$GITHUB_OUTPUT"
            echo "## 🛡️ Jira Guard — Skipped (Dependabot PR by $PR_AUTHOR)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          KEY=""

          if [ "$GIT_EVENT" = "push" ]; then
            if [[ "$HEAD_COMMIT_MSG" =~ ([A-Z]+-[0-9]+) ]]; then
              KEY="${BASH_REMATCH[1]}"
            fi
          else
            if [[ "$HEAD_REF" == "dev" && "$BASE_REF" == "main" ]]; then
              echo "key=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$HEAD_REF" =~ ^([A-Z]+-[0-9]+)(-|$) ]]; then
              KEY="${BASH_REMATCH[1]}"
            elif [[ "$PR_TITLE" =~ ^([A-Z]+-[0-9]+)([^0-9]|$) ]]; then
              KEY="${BASH_REMATCH[1]}"
            fi
          fi

          if [ -z "$KEY" ]; then
            echo "❌ No Jira key in branch name or PR title" >> errors.log
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # ── 2 · Transition to Review (PR opened/reopened/synchronized) ─
      - name: "2 · Transition to Review"
        if: steps.jira_key.outputs.key != '' && github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          JIRA_KEY: ${{ steps.jira_key.outputs.key }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN: ${{ inputs.jira_domain }}
        run: |
          HTTP=$(curl -s -o jira_response.json -w "%{http_code}" \
            -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY")

          if [ "$HTTP" -ne 200 ]; then
            echo "❌ Jira issue $JIRA_KEY not found (HTTP $HTTP)" >> errors.log
            exit 0
          fi

          STATUS=$(jq -r '.fields.status.name' jira_response.json)

          case "$STATUS" in
            "To Do"|"Done")
              echo "❌ Issue $JIRA_KEY is in '$STATUS' — cannot transition to Review (do not touch To Do/Done issues)" >> errors.log
              ;;
            "Review")
              :
              ;;
            *)
              TRANS=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
                -H "Accept: application/json" \
                "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions")
              TRANS_ID=$(echo "$TRANS" | jq -r '.transitions[] | select(.to.name=="Review") | .id' | head -1)
              if [ -z "$TRANS_ID" ]; then
                echo "❌ Could not find a transition to 'Review' for $JIRA_KEY (available: $(echo \"$TRANS\" | jq -r '[.transitions[].name] | join(\", \")'))" >> errors.log
              else
                curl -sf -X POST \
                  -u "$JIRA_EMAIL:$JIRA_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"transition\":{\"id\":\"$TRANS_ID\"}}" \
                  "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions"
                echo "✅ Transitioned $JIRA_KEY: '$STATUS' → Review"
              fi
              ;;
          esac

      # ── 2 · Output transition for Review comment ──
      - name: "2 · Output Review transition context"
        id: review_transition
        if: steps.jira_key.outputs.key != '' && github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          TRANSITIONED="false"
          if [ -f jira_response.json ]; then
            STATUS=$(jq -r '.fields.status.name' jira_response.json 2>/dev/null || echo "")
            case "$STATUS" in
              "To Do"|"Done"|"Review") ;;
              *) TRANSITIONED="true" ;;
            esac
          fi
          echo "transitioned=$TRANSITIONED" >> "$GITHUB_OUTPUT"

      # ── 2b · Transition to DONE on push (PR merged → main) ──
      - name: "2b · Transition to DONE"
        if: steps.jira_key.outputs.key != '' && github.event_name == 'push'
        env:
          JIRA_KEY: ${{ steps.jira_key.outputs.key }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN: ${{ inputs.jira_domain }}
        run: |
          [[ "${RUNNER_DEBUG:-0}" == "1" ]] && set -x

          ISSUE=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY?fields=status")
          FROM_STATUS=$(echo "$ISSUE" | jq -r '.fields.status.name')

          case "$FROM_STATUS" in
            "To Do")
              echo "❌ Issue $JIRA_KEY is in 'To Do' — cannot move to Done" >> errors.log
              exit 0
              ;;
            "Done")
              echo "ℹ️  $JIRA_KEY already in Done — skipping"
              exit 0
              ;;
          esac

          TRANS=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions")
          TRANS_ID=$(echo "$TRANS" | jq -r '.transitions[] | select(.to.name=="Done") | .id' | head -1)

          if [ -z "$TRANS_ID" ]; then
            echo "❌ Could not find a transition to 'Done' for $JIRA_KEY (available: $(echo "$TRANS" | jq -r '[.transitions[].name] | join(", ")'))" >> errors.log
          else
            curl -sf -X POST \
              -u "$JIRA_EMAIL:$JIRA_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"transition\":{\"id\":\"$TRANS_ID\"}}" \
              "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions"
            echo "✅ Transitioned $JIRA_KEY: '$FROM_STATUS' → 'Done'"
          fi

      # ── 2b · Output Done transition context ──
      - name: "2b · Output Done transition context"
        id: done_transition
        if: steps.jira_key.outputs.key != '' && github.event_name == 'push'
        run: |
          echo "transitioned=true" >> "$GITHUB_OUTPUT"

      # ── 2c · Transition to In Progress on changes requested ──
      - name: "2c · Transition to In Progress (changes requested)"
        if: steps.jira_key.outputs.key != '' && github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested'
        env:
          JIRA_KEY: ${{ steps.jira_key.outputs.key }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN: ${{ inputs.jira_domain }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          ISSUE=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY?fields=status")
          FROM_STATUS=$(echo "$ISSUE" | jq -r '.fields.status.name')

          case "$FROM_STATUS" in
            "To Do"|"Done")
              echo "❌ Issue $JIRA_KEY is in '$FROM_STATUS' — cannot move to In Progress (do not touch To Do/Done issues)" >> errors.log
              exit 0
              ;;
            "In Progress")
              echo "ℹ️  $JIRA_KEY already in In Progress — skipping"
              exit 0
              ;;
          esac

          TRANS=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions")
          TRANS_ID=$(echo "$TRANS" | jq -r '.transitions[] | select(.to.name=="In Progress") | .id' | head -1)
          if [ -z "$TRANS_ID" ]; then
            echo "❌ Could not find a transition to 'In Progress' for $JIRA_KEY (available: $(echo "$TRANS" | jq -r '[.transitions[].name] | join(", ")'))" >> errors.log
          else
            curl -sf -X POST \
              -u "$JIRA_EMAIL:$JIRA_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"transition\":{\"id\":\"$TRANS_ID\"}}" \
              "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions"
            echo "✅ Transitioned $JIRA_KEY: '$FROM_STATUS' → 'In Progress' (changes requested by $REVIEWER)"
          fi
          # Comment posting delegated to AdolfoBOT job below

      # ── 2c · Output In Progress transition context ──
      - name: "2c · Output In Progress transition context"
        id: inprogress_transition
        if: steps.jira_key.outputs.key != '' && github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested'
        run: |
          echo "transitioned=true" >> "$GITHUB_OUTPUT"

      # ── 2d · Transition to Ready To Deploy on approval ──
      # On approved review: move to Ready To Deploy from any status except
      # To Do/Done (those are hard errors). Idempotent if already there.
      - name: "2d · Transition to Ready To Deploy (approved)"
        if: steps.jira_key.outputs.key != '' && github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.merged == false
        env:
          JIRA_KEY: ${{ steps.jira_key.outputs.key }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN: ${{ inputs.jira_domain }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          ISSUE=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY?fields=status")
          CURRENT=$(echo "$ISSUE" | jq -r '.fields.status.name')

          case "$CURRENT" in
            "To Do"|"Done")
              echo "❌ Issue $JIRA_KEY is in '$CURRENT' — cannot move to Ready To Deploy (do not touch To Do/Done issues)" >> errors.log
              exit 0
              ;;
            "Ready To Deploy")
              echo "ℹ️  $JIRA_KEY already in Ready To Deploy — skipping"
              exit 0
              ;;
          esac

          TRANS=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions")
          TRANS_ID=$(echo "$TRANS" | jq -r '.transitions[] | select(.to.name=="Ready To Deploy") | .id' | head -1)
          if [ -z "$TRANS_ID" ]; then
            echo "❌ No 'Ready To Deploy' transition available for $JIRA_KEY (current: $CURRENT; available: $(echo "$TRANS" | jq -r '[.transitions[].name] | join(", ")'))" >> errors.log
          else
            curl -sf -X POST \
              -u "$JIRA_EMAIL:$JIRA_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"transition\":{\"id\":\"$TRANS_ID\"}}" \
              "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions"
            echo "✅ Transitioned $JIRA_KEY: '$CURRENT' → 'Ready To Deploy' (approved by $REVIEWER)"
          fi

      # ── 3 · Blocking dependencies must be DONE ─
      - name: "3 · Jira dependencies"
        if: steps.jira_key.outputs.key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN: ${{ inputs.jira_domain }}
        run: |
          [ ! -f jira_response.json ] && exit 0

          # Only pick up links where THIS issue is blocked by another (inward direction).
          # Outward "Blocks" links (this issue blocks something else) must NOT block the PR.
          BLOCKERS=$(jq -r '
            .fields.issuelinks[]?
            | select(.type.name=="Blocks" and (.inwardIssue != null))
            | .inwardIssue.key
          ' jira_response.json 2>/dev/null)

          OPEN=""
          for B in $BLOCKERS; do
            RESP=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
              -H "Accept: application/json" \
              "https://$JIRA_DOMAIN/rest/api/3/issue/$B" 2>/dev/null) || continue
            B_STATUS=$(echo "$RESP" | jq -r '.fields.status.name')
            B_STATUS_LOWER=$(echo "$B_STATUS" | tr '[:upper:]' '[:lower:]')
            if [ "$B_STATUS_LOWER" != "done" ]; then
              OPEN="$OPEN $B ($B_STATUS)"
            fi
          done

          if [ -n "$OPEN" ]; then
            echo "❌ Blocked by unresolved dependencies:$OPEN" >> errors.log
          fi

      # ── 4 · Sensitive / secret file scan ───────
      - name: "4 · Sensitive file scan"
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF"..."$HEAD_SHA" 2>/dev/null || true)

          # Patterns that should never appear in a PR
          DENY='(\.env(\..*)?|\.pem|\.key|\.p12|\.pfx|\.keystore|\.jks|\.secret|\.secrets|\.npmrc|\.pypirc|id_rsa|id_ed25519|id_dsa|credentials|service[-_]account.*\.json)$'

          FLAGGED=""
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            BASENAME=$(basename -- "$FILE")
            if [[ "$BASENAME" =~ $DENY ]]; then
              FLAGGED="${FLAGGED}  • ${FILE}\n"
            fi
          done <<< "$CHANGED"

          if [ -n "$FLAGGED" ]; then
            echo "❌ Sensitive files detected in PR:" >> errors.log
            echo -e "$FLAGGED" >> errors.log
          fi

      # ── 5 · PR description ────────────────────
      - name: "5 · PR description"
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          LEN=${#PR_BODY}
          if [ "$LEN" -lt ${{ inputs.min_description_length }} ]; then
            echo "⚠️  PR description too short ($LEN chars, min ${{ inputs.min_description_length }})" >> warnings.log
          fi

      # # ── 6 · Branch policy ─────────────────────
      # - name: "6 · Branch policy"
      #   env:
      #     BASE_REF: ${{ github.event.pull_request.base.ref }}
      #     HEAD_REF: ${{ github.event.pull_request.head.ref }}
      #   run: |
      #     # Release PR: dev → main is always allowed
      #     if [[ "$HEAD_REF" == "dev" && "$BASE_REF" == "main" ]]; then
      #       exit 0
      #     fi

      #     # All branches must target dev or main
      #     if [[ "$BASE_REF" != "dev" && "$BASE_REF" != "main" ]]; then
      #       echo "❌ Branch '$HEAD_REF' must target 'dev' or 'main', not '$BASE_REF'" >> errors.log
      #     fi

      # ── 📋 Final report ───────────────────────
      - name: "📋 Summary"
        if: always()
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_REF: ${{ github.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          BRANCH_DISPLAY="${HEAD_REF:-${PUSH_REF}}"
          BASE_DISPLAY="${BASE_REF:-}"
          [ -n "$BASE_DISPLAY" ] && BRANCH_DISPLAY="${BRANCH_DISPLAY} → ${BASE_DISPLAY}"
          (
            echo "## 🛡️ Jira Guard"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Jira key | \`${{ steps.jira_key.outputs.key || 'n/a' }}\` |"
            echo "| PR author | \`${PR_AUTHOR:-n/a}\` |"
            echo "| Event | \`${{ github.event_name }}\` / \`${{ github.event.action }}\` |"
            echo "| Ref | \`$BRANCH_DISPLAY\` |"
            echo ""
            if [ -s warnings.log ]; then
              echo "### ⚠️  Warnings"
              cat warnings.log
              echo ""
            fi
            if [ -s errors.log ]; then
              echo "### ❌ Errors"
              cat errors.log
            else
              echo "### ✅ All checks passed"
            fi
          ) | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -s errors.log ]; then
            exit 1
          fi

  # ── Conflict scanner — runs on PR close only ────────────────────────────
  conflict-check:
    name: Conflict Check
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
    outputs:
      conflict_count: ${{ steps.scan.outputs.conflict_count }}
      conflict_details_json: ${{ steps.scan.outputs.conflict_details_json }}

    steps:
      - name: Scan open PRs for merge conflicts
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN: ${{ inputs.jira_domain }}
          REPO: ${{ github.repository }}
        run: |
          [[ "${RUNNER_DEBUG:-0}" == "1" ]] && set -x

          PRS=$(gh api "repos/$REPO/pulls?state=open&per_page=100")
          CONFLICT_COUNT=0
          DETAILS="[]"

          while IFS= read -r PR; do
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            HEAD_REF=$(echo "$PR"  | jq -r '.head.ref')
            BASE_REF=$(echo "$PR"  | jq -r '.base.ref')

            # Skip dev→main release PRs
            [[ "$HEAD_REF" == "dev" && "$BASE_REF" == "main" ]] && continue

            # GitHub computes mergeability lazily — retry up to 5 times
            MERGEABLE="null"
            for i in $(seq 1 5); do
              PR_DETAIL=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
              MERGEABLE=$(echo "$PR_DETAIL" | jq -r '.mergeable')
              MERGEABLE_STATE=$(echo "$PR_DETAIL" | jq -r '.mergeable_state')
              [[ "$MERGEABLE" != "null" ]] && break
              sleep 6
            done

            [[ "$MERGEABLE" != "false" && "$MERGEABLE_STATE" != "dirty" ]] && continue

            echo "⚠️  PR #$PR_NUMBER ($HEAD_REF → $BASE_REF) has conflicts"
            CONFLICT_COUNT=$((CONFLICT_COUNT + 1))

            # Extract Jira key from branch name
            KEY=""
            [[ "$HEAD_REF" =~ ^([A-Z]+-[0-9]+)(-|$) ]] && KEY="${BASH_REMATCH[1]}"
            [ -z "$KEY" ] && echo "  ↳ No Jira key found, skipping" && continue

            # Transition to In Progress using only .to.name
            TRANS=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" -H "Accept: application/json" \
              "https://$JIRA_DOMAIN/rest/api/3/issue/$KEY/transitions")
            TRANS_ID=$(echo "$TRANS" | jq -r '
              .transitions[] | select(.to.name=="In Progress") | .id
            ' | head -1)
            if [ -n "$TRANS_ID" ]; then
              curl -s -o /dev/null -X POST -u "$JIRA_EMAIL:$JIRA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"transition\":{\"id\":\"$TRANS_ID\"}}" \
                "https://$JIRA_DOMAIN/rest/api/3/issue/$KEY/transitions"
              echo "  ↳ $KEY → In Progress"
            fi

            PR_URL="${GITHUB_SERVER_URL}/$REPO/pull/$PR_NUMBER"
            DETAILS=$(echo "$DETAILS" | jq \
              --arg key "$KEY" \
              --arg pr_url "$PR_URL" \
              --arg pr_num "$PR_NUMBER" \
              '. + [{"jira_key": $key, "pr_url": $pr_url, "pr_number": $pr_num}]')

          done < <(echo "$PRS" | jq -c '.[]')

          echo "conflict_count=$CONFLICT_COUNT" >> "$GITHUB_OUTPUT"
          echo "conflict_details_json=$DETAILS" >> "$GITHUB_OUTPUT"
          echo "## 🔀 Conflict Check — $CONFLICT_COUNT conflicting PR(s) found" >> "$GITHUB_STEP_SUMMARY"

  # ── AdolfoBOT — post conflict notifications ──────────────────────────────
  notify-conflicts:
    name: AdolfoBOT — Notify Conflicts
    needs: [conflict-check]
    if: always() && needs.conflict-check.result == 'success' && needs.conflict-check.outputs.conflict_count != '0'
    strategy:
      matrix:
        conflict: ${{ fromJSON(needs.conflict-check.outputs.conflict_details_json) }}
    uses: byteit-ai/.github/.github/workflows/adolfobot.yml@main
    with:
      workflow_name: "Conflict Check"
      mode: "comment"
      jira_key_override: ${{ matrix.conflict.jira_key }}
      comment_body: "⚠️ PR #${{ matrix.conflict.pr_number }} has merge conflicts: ${{ matrix.conflict.pr_url }}"
    secrets: inherit

  # ── AdolfoBOT — move issue back to In Progress on workflow failure ───────
  notify-failure:
    name: AdolfoBOT — Notify Failure
    needs: [jira-guard]
    if: failure() && github.event_name == 'pull_request' && github.run_attempt == 1
    uses: byteit-ai/.github/.github/workflows/adolfobot.yml@main
    with:
      workflow_name: "Jira Guard"
    secrets: inherit

  # ── PR Agent — automated review (opened only) ─────────────────────────────
  pr-agent-full:
    name: PR Agent (full review)
    needs: [jira-guard]
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && inputs.pr_agent_enabled && github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/pr-agent.yml
    with:
      mode: "full"
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}

  # ── PR Agent found issues → move issue back to In Progress ───────────────
  # The agent posts a comment only when it finds problems (it stays silent on
  # clean PRs). If it did post, treat it like "changes requested": transition
  # the linked Jira issue to In Progress (.to.name). The comment is posted by a
  # separate job (pr-agent-comment) that calls adolfobot.yml — a reusable
  # workflow can only be invoked at job level, never inside a step.
  pr-agent-changes:
    name: PR Agent — In Progress
    needs: [pr-agent-full]
    if: github.event_name == 'pull_request' && needs.pr-agent-full.outputs.posted_comments == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jira_key: ${{ steps.jira_key.outputs.key }}
      comment_body: ${{ steps.jira_key.outputs.comment_body }}
    steps:
      - name: Resolve Jira key
        id: jira_key
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN: ${{ inputs.jira_domain }}
        run: |
          KEY=""
          if [[ "$HEAD_REF" =~ ^([A-Z]+-[0-9]+)(-|$) ]]; then
            KEY="${BASH_REMATCH[1]}"
          fi

          # Only touch Jira if the issue actually exists. Otherwise leave the
          # key empty so the transition step and comment job are skipped (never
          # a failure), and print a warning.
          if [ -n "$KEY" ]; then
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -u "$JIRA_EMAIL:$JIRA_TOKEN" \
              -H "Accept: application/json" \
              "https://$JIRA_DOMAIN/rest/api/3/issue/$KEY" 2>/dev/null) || HTTP=000
            if [ "$HTTP" != "200" ]; then
              echo "⚠️  Jira issue $KEY not found (HTTP $HTTP) — PR Agent review done, Jira left untouched"
              KEY=""
            fi
          fi

          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "comment_body=🔴 PR Agent found issues on PR #${PR_NUMBER} → In Progress." >> "$GITHUB_OUTPUT"

      - name: Transition to In Progress
        if: steps.jira_key.outputs.key != ''
        env:
          JIRA_KEY: ${{ steps.jira_key.outputs.key }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN: ${{ inputs.jira_domain }}
        run: |
          ISSUE=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY?fields=status") || exit 0
          FROM_STATUS=$(echo "$ISSUE" | jq -r '.fields.status.name')

          TRANS=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" \
            "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions") || exit 0
          TRANS_ID=$(echo "$TRANS" | jq -r '.transitions[] | select(.to.name=="In Progress") | .id' | head -1)

          if [ -n "$TRANS_ID" ]; then
            curl -sf -X POST \
              -u "$JIRA_EMAIL:$JIRA_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"transition\":{\"id\":\"$TRANS_ID\"}}" \
              "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY/transitions"
            echo "✅ Transitioned $JIRA_KEY: '$FROM_STATUS' → 'In Progress' (PR Agent found issues)"
          else
            echo "⚠️  No 'In Progress' transition available for $JIRA_KEY"
          fi

  pr-agent-comment:
    name: AdolfoBOT — PR Agent Findings
    needs: [pr-agent-changes]
    if: needs.pr-agent-changes.outputs.jira_key != ''
    uses: byteit-ai/.github/.github/workflows/adolfobot.yml@main
    with:
      workflow_name: "PR Agent"
      mode: "comment"
      jira_key_override: ${{ needs.pr-agent-changes.outputs.jira_key }}
      comment_body: ${{ needs.pr-agent-changes.outputs.comment_body }}
    secrets: inherit

  # ── AdolfoBOT — build every transition comment for this run ──────────
  # A single job computes 0..N comments (Review on PR open, In Progress on
  # changes_requested, Done on push) and AdolfoBOT posts them all in one
  # job — no per-transition prepare+post node pairs that render as skipped.
  prepare-comments:
    name: AdolfoBOT — Prepare Comments
    needs: [jira-guard]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      comments_json: ${{ steps.build.outputs.comments_json }}
    steps:
      - id: build
        env:
          EVENT_NAME:    ${{ github.event_name }}
          EVENT_ACTION:  ${{ github.event.action }}
          HEAD_REF:      ${{ github.event.pull_request.head.ref }}
          PR_NUMBER:     ${{ github.event.pull_request.number }}
          PR_AUTHOR:     ${{ github.event.pull_request.user.login }}
          MOVED_TO_REVIEW: ${{ needs.jira-guard.outputs.moved_to_review }}
          REQUESTED_REVIEWER: ${{ github.event.requested_reviewer.login }}
          PENDING_REVIEWERS: ${{ join(github.event.pull_request.requested_reviewers.*.login, ',') }}
          GH_TOKEN:      ${{ github.token }}
          REPO:          ${{ github.repository }}
          REVIEW_STATE:  ${{ github.event.review.state }}
          REVIEWER:      ${{ github.event.review.user.login }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          PUSHER:        ${{ github.event.pusher.name }}
          REF:           ${{ github.ref_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          JIRA_EMAIL:    ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN:    ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN:   ${{ inputs.jira_domain }}
        run: |
          python3 - << 'PYEOF'
          import json, os, re, urllib.error, urllib.request, urllib.parse, base64

          event = os.environ.get("EVENT_NAME", "")
          action = os.environ.get("EVENT_ACTION", "")
          comments = []

          def key_from(ref):
              m = re.match(r"^([A-Z]+-[0-9]+)(-|$)", ref or "")
              return m.group(1) if m else ""

          def api_get(url, headers):
              req = urllib.request.Request(url, headers={**headers, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode())

          def gh_get(path):
              return api_get(
                  f"https://api.github.com/{path}",
                  {"Authorization": f"Bearer {os.environ.get('GH_TOKEN', '')}"},
              )

          def resolve_mention(github_login):
              """Map a GitHub login to a Jira {id, name}, or None when no confident match.

              Never guesses: pinging the wrong person is worse than not pinging.
              """
              email = os.environ.get("JIRA_EMAIL", "")
              token = os.environ.get("JIRA_TOKEN", "")
              domain = os.environ.get("JIRA_DOMAIN", "")
              if not (github_login and email and token and domain):
                  return None
              creds = base64.b64encode(f"{email}:{token}".encode()).decode()
              jira_headers = {"Authorization": f"Basic {creds}"}
              try:
                  full_name = (gh_get(f"users/{github_login}").get("name") or "").strip()
                  queries = [q for q in (full_name, github_login) if q]
                  login_l = github_login.lower()
                  for q in queries:
                      users = api_get(
                          f"https://{domain}/rest/api/3/user/search?{urllib.parse.urlencode({'query': q})}",
                          jira_headers,
                      )
                      for u in users:
                          name = (u.get("displayName") or "").lower()
                          local = (u.get("emailAddress") or "").lower().split("@")[0]
                          if name == full_name.lower() or login_l in (name, local):
                              return {"id": u["accountId"], "name": u["displayName"]}
              except (urllib.error.URLError, json.JSONDecodeError, KeyError) as e:
                  print(f"⚠️  mention resolve failed for {github_login}: {e}")
              return None

          def reviewers_to_ping(pr_number):
              """Who must act next: the requested reviewer, else pending ones, else the last reviewer."""
              if os.environ.get("REQUESTED_REVIEWER"):
                  return [os.environ["REQUESTED_REVIEWER"]]
              pending = [r for r in os.environ.get("PENDING_REVIEWERS", "").split(",") if r]
              if pending:
                  return pending
              try:
                  reviews = gh_get(f"repos/{os.environ.get('REPO', '')}/pulls/{pr_number}/reviews")
              except (urllib.error.URLError, json.JSONDecodeError) as e:
                  print(f"⚠️  could not list reviews: {e}")
                  return []
              last = next((r["user"]["login"] for r in reversed(reviews) if r.get("user")), "")
              return [last] if last else []

          def add(key, body, mention_logins=()):
              """Empty mention_logins → AdolfoBOT pings the Jira assignee (the developer)."""
              if not key:
                  return
              entry = {"jira_key": key, "comment_body": body}
              mentions = [m for m in map(resolve_mention, mention_logins) if m]
              if mentions:
                  entry["mentions"] = mentions
              comments.append(entry)

          pr_number = os.environ.get("PR_NUMBER", "")
          key = key_from(os.environ.get("HEAD_REF", ""))

          if event == "pull_request":
              # Comment only when the ticket really moved to Review (open, or a
              # push/re-request after changes) and tag whoever must review next.
              if os.environ.get("MOVED_TO_REVIEW") == "true" and os.environ.get("PR_AUTHOR") != "dependabot[bot]":
                  back = action == "synchronize"
                  body = f"PR #{pr_number} updated → back in Review." if back else f"PR #{pr_number} → Review."
                  add(key, body, reviewers_to_ping(pr_number))

          elif event == "pull_request_review":
              state = os.environ.get("REVIEW_STATE", "")
              reviewer = os.environ.get("REVIEWER", "")
              if state == "changes_requested":
                  body = f"{reviewer} requested changes on PR #{pr_number} → In Progress."
                  evt_path = os.environ.get("GITHUB_EVENT_PATH", "")
                  if evt_path and os.path.exists(evt_path):
                      with open(evt_path) as f:
                          evt = json.load(f)
                      note = ((evt.get("review") or {}).get("body") or "").strip()
                      if note:
                          body += "\n" + (note if len(note) <= 200 else note[:197] + "...")
                  add(key, body)
              elif state == "approved":
                  add(key, f"{reviewer} approved PR #{pr_number} → Ready To Deploy.")

          elif event == "push":
              m = re.search(r"([A-Z]+-[0-9]+)", os.environ.get("HEAD_COMMIT_MSG", "") or "")
              if m:
                  add(m.group(1), f"Merged to {os.environ.get('REF')} → Done.")

          gh = os.environ.get("GITHUB_OUTPUT", "")
          if gh:
              with open(gh, "a") as f:
                  f.write(f"comments_json={json.dumps(comments, separators=(',', ':'))}\n")
          PYEOF

  post-comments:
    name: AdolfoBOT — Post Comments
    needs: [prepare-comments]
    if: >-
      always() &&
      needs.prepare-comments.result == 'success' &&
      needs.prepare-comments.outputs.comments_json != '' &&
      needs.prepare-comments.outputs.comments_json != '[]'
    uses: byteit-ai/.github/.github/workflows/adolfobot.yml@main
    with:
      workflow_name: "Jira Guard"
      mode: "comment"
      comments_json: ${{ needs.prepare-comments.outputs.comments_json }}
    secrets: inherit

